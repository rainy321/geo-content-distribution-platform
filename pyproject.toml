[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "social-auto-upload"
version = "0.1.0"
description = "Social media auto uploader"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "Flask[async]==3.1.1",
  "apscheduler==3.11.0",
  "flask-cors==6.0.0",
  "loguru==0.7.3",
  "openpyxl>=3.1.5,<4",
  "pillow>=11,<13",
  "qrcode==8.2",
  "requests==2.32.3",
  "segno>=1.6.6",
  "waitress==3.0.2",
]

[project.scripts]
sau = "sau_cli:main"
sau-web = "sau_web:main"
sau-worker = "sau_worker:main"

[project.optional-dependencies]
# Browser/media dependencies are required by the local publishing worker, but are
# intentionally excluded from the lightweight Vercel demo control plane.
web = [
  "opencv-python>=4.13.0.92",
  "patchright==1.58.2",
  "playwright==1.52.0",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["conf", "sau_backend", "sau_cli", "sau_web", "sau_worker"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["uploader*", "utils*", "myUtils*", "services*", "db*"]

[tool.setuptools.package-data]
utils = ["stealth.min.js"]
